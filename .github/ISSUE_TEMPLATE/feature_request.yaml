name: Feature Request
description: Suggest something Oxbow should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Oxbow is deliberately small. Before suggesting something, please skim the
        "Do not suggest" section of [`docs/development.md`](https://github.com/barclay/oxbow/blob/main/docs/development.md)
        and the scope notes in [`docs/architecture.md`](https://github.com/barclay/oxbow/blob/main/docs/architecture.md) —
        several obvious ideas were considered and rejected for stated reasons.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched [existing issues](https://github.com/barclay/oxbow/issues?q=is%3Aissue) for a duplicate
          required: true
        - label: This is about the Oxbow macOS app, not the underlying TwitchDownloaderCLI
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the solution you have in mind.
      placeholder: I archive a weekly stream and re-enter the same render settings every time.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Oxbow to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried instead
      description: Including doing it by hand with the CLI.
    validations:
      required: false
