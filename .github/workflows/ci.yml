# CI for pull requests and pushes to main.
#
# Two independent jobs, matching the split documented in CONTRIBUTING.md:
#
#   - OxbowKit tests: the library test suite, plus a coverage floor over
#     Sources/OxbowKit. Needs only a Swift toolchain.
#   - App build: an UNSIGNED build of the app target. No signing identity
#     exists on runners, so CODE_SIGNING_ALLOWED=NO; the "Embed & Sign
#     Helpers" phase is designed to warn and continue when build/helper and
#     build/ffmpeg are absent, so this needs no .NET or FFmpeg toolchain.
#
# Neither job needs the vendor/TwitchDownloader submodule (it is only an
# input to publishing the helper), so checkout skips submodules — the default.
#
# The consequence is that nothing here exercises the real embed-and-sign path.
# full-build.yml does: it checks out the submodule, publishes the helper,
# builds FFmpeg, and asserts the assembled bundle. It is slow, so it runs on
# pushes to main, nightly, and on demand rather than per PR.
#
# Signed release builds are a separate, later workflow: they need the
# Developer ID certificate and notary key as repository secrets
# (docs/signing.md §8).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: OxbowKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      # Runs `swift test --enable-code-coverage` itself, then reports coverage
      # over Sources/OxbowKit and fails below the floor. One invocation rather
      # than a separate `swift test` step, so the suite is not built twice.
      # The per-file table lands in this job's summary in the Actions UI.
      - name: Run OxbowKit test suite and check coverage
        run: ./scripts/coverage.sh

  app-build:
    name: App build and tests (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          # scripts/stamp-version.sh derives CFBundleVersion from the commit
          # count, and checkout defaults to a depth-1 clone that would report
          # 1. The script warns when it sees a shallow checkout rather than
          # stamping a wrong number, so removing this turns into a build
          # warning rather than a silent bad version — but it still needs to
          # be here. The `tests` job below builds no bundle and does not.
          fetch-depth: 0
      - name: Toolchain versions
        run: xcodebuild -version
      # `test` rather than `build`: it compiles the app target AND runs the
      # app-target unit tests, which `build` alone would silently skip.
      # OxbowUITests is excluded deliberately — this slice writes no UI tests,
      # and launching a GUI app on a runner buys nothing here.
      - name: Build and test Oxbow.app
        run: >
          xcodebuild test -project Oxbow.xcodeproj -scheme Oxbow
          -configuration Debug
          -only-testing:OxbowTests
          CODE_SIGNING_ALLOWED=NO
